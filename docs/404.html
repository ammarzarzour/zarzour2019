<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174b3d">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة | زرزور</title>
<style>
:root{color-scheme:light;--green:#174b3d;--gold:#c5a15b;--paper:#fff;--bg:#f7f5ef;--ink:#17352d;--muted:#69776f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#e8eddf,transparent 42%),var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.card{width:min(620px,100%);padding:clamp(28px,7vw,56px);border:1px solid #e4e7df;border-radius:26px;background:var(--paper);box-shadow:0 24px 70px #193c3012;text-align:center}.mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border-radius:18px;background:var(--green);color:var(--gold);font-size:28px;font-weight:800}.code{color:#9b824c;font-size:13px;font-weight:800;letter-spacing:.14em;direction:ltr}h1{margin:8px 0 12px;font-size:clamp(30px,7vw,44px);line-height:1.25}.card p{margin:0 auto 24px;max-width:460px;color:var(--muted)}.actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}.btn,.lang{min-height:46px;padding:10px 17px;border-radius:12px;font:inherit;font-weight:700}.btn{display:inline-flex;align-items:center;background:var(--green);color:white;text-decoration:none}.btn:hover{background:#246b54}.lang{border:1px solid #dfe5dc;background:white;color:var(--ink);cursor:pointer}.lang:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.brand{margin-top:28px;color:#7d8b82;font-size:13px;direction:ltr}
</style>
</head>
<body>
<main class="card">
<div class="mark" aria-hidden="true">ز</div>
<div class="code">404</div>
<h1 id="title">الصفحة غير موجودة</h1>
<p id="message">قد يكون الرابط قديماً أو أن الصفحة نُقلت. يمكنك العودة إلى الصفحة الرئيسية ومتابعة استكشاف خدمات زرزور.</p>
<div class="actions">
<a class="btn" id="home" href="./">العودة إلى الرئيسية</a>
<button class="lang" id="language" type="button" aria-label="Switch language">English</button>
</div>
<div class="brand">ZARZOUR TRAVEL · TOURISM · HAJJ & UMRAH</div>
</main>
<script>
(()=>{const segments=location.pathname.split("/").filter(Boolean);document.getElementById("home").href=location.hostname.endsWith(".github.io")&&segments.length?"/"+segments[0]+"/":"/";let lang=(navigator.language||"ar").toLowerCase().startsWith("en")?"en":"ar";const text={ar:{title:"الصفحة غير موجودة",message:"قد يكون الرابط قديماً أو أن الصفحة نُقلت. يمكنك العودة إلى الصفحة الرئيسية ومتابعة استكشاف خدمات زرزور.",home:"العودة إلى الرئيسية",button:"English"},en:{title:"Page not found",message:"This link may be outdated or the page may have moved. Return to the homepage to explore Zarzour services.",home:"Back to homepage",button:"العربية"}};const update=()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.getElementById("title").textContent=text[lang].title;document.getElementById("message").textContent=text[lang].message;document.getElementById("home").textContent=text[lang].home;document.getElementById("language").textContent=text[lang].button};document.getElementById("language").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";update()});update()})();
</script>
</body>
</html>
