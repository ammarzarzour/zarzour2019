name: Validate standalone Zarzour Soft package
on:
  push:
    paths:
      - 'docs/soft/**'
      - 'docs/soft-standalone-deployment.md'
      - 'scripts/build-soft-standalone.mjs'
      - 'scripts/build-soft-standalone.test.mjs'
      - 'scripts/soft-served-artifact.test.mjs'
      - 'scripts/projects-model.test.mjs'
      - 'scripts/test-soft-spaced-attributes.mjs'
      - '.github/workflows/soft-standalone.yml'
  pull_request:
    paths:
      - 'docs/soft/**'
      - 'docs/soft-standalone-deployment.md'
      - 'scripts/build-soft-standalone.mjs'
      - 'scripts/build-soft-standalone.test.mjs'
      - 'scripts/soft-served-artifact.test.mjs'
      - 'scripts/projects-model.test.mjs'
      - 'scripts/test-soft-spaced-attributes.mjs'
      - '.github/workflows/soft-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound the standalone preview validation if a test or build hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check standalone browser modules
        run: |
          node --check docs/soft/brief.mjs
          node --check docs/soft/brief-model.mjs
          node --check docs/soft/projects.mjs
          node --check docs/soft/projects-model.mjs
      - name: Test isolated packaging and checked-in assets
        run: node --test scripts/build-soft-standalone.test.mjs
      - name: Test standalone project model validation
        run: node --test scripts/projects-model.test.mjs
      - name: Test standalone HTML form and network boundaries
        run: node --test scripts/test-soft-spaced-attributes.mjs
      - name: Build actual independent package
        run: node scripts/build-soft-standalone.mjs
      - name: Smoke-test independent site over local HTTP
        run: node --test scripts/soft-served-artifact.test.mjs
      - name: Verify exact allowlisted files and byte-for-byte source parity
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/zarzour-soft -mindepth 1 -type f | wc -l)" -eq 7
          test "$(find dist/zarzour-soft -mindepth 1 | wc -l)" -eq 7
          for file in index.html brief.html brief.mjs brief-model.mjs projects.html projects.mjs projects-model.mjs; do
            test -f "dist/zarzour-soft/$file"
            cmp "docs/soft/$file" "dist/zarzour-soft/$file"
          done
      - name: Upload independently deployable Soft package
        uses: actions/upload-artifact@v4
        with:
          name: zarzour-soft-standalone
          path: dist/zarzour-soft/
          if-no-files-found: error
          retention-days: 14
