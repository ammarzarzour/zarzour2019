name: Travel return evidence policy tests
on:
  push:
    paths:
      - 'scripts/return-evidence-policy.mjs'
      - 'scripts/return-evidence-policy.test.mjs'
      - '.github/workflows/travel-return-evidence.yml'
  pull_request:
    paths:
      - 'scripts/return-evidence-policy.mjs'
      - 'scripts/return-evidence-policy.test.mjs'
      - '.github/workflows/travel-return-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-return-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline return evidence tests
        run: node --test scripts/return-evidence-policy.test.mjs
