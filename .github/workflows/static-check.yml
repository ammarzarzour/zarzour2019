name: Validate Zarzour static pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/static-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/static-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check static pages
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node scripts/check-static-site.mjs
      - name: Test trip request workflows
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/request.test.mjs
      - name: Test return tracking rules
        # Validate traveler-return evidence and queue consistency without personal data.
        if: ${{ !cancelled() }}
        run: node --test scripts/return-tracking.test.mjs
      - name: Test operations dashboard model
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/operations.test.mjs
      - name: Test independent Zarzour Soft scope builder
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/soft-brief.test.mjs
      - name: Test Zarzour Soft standalone packaging guard
        # Run packaging isolation regressions on every Travel/Soft static validation,
        # not only when the dedicated guard workflow's path filters match.
        if: ${{ !cancelled() }}
        run: node --test scripts/test-soft-spaced-attributes.mjs
      - name: Build independently deployable Zarzour Soft bundle
        # This is a portable preview artifact, not a production deployment.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/build-soft-standalone.mjs
          test "$(find dist/zarzour-soft -type f | wc -l)" -eq 7
          for file in index.html brief.html brief.mjs brief-model.mjs projects.html projects.mjs projects-model.mjs; do
            cmp "docs/soft/$file" "dist/zarzour-soft/$file"
          done
      - name: Upload independent Zarzour Soft preview
        if: ${{ !cancelled() && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: zarzour-soft-standalone-preview
          path: dist/zarzour-soft/
          if-no-files-found: error
          retention-days: 14
      - name: Test partner verification register
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/partners.test.mjs
      - name: Test customer inquiry pipeline
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/customers.test.mjs
      - name: Test contracts and obligations register
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/contracts.test.mjs
      - name: Test campaign operations
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/campaigns.test.mjs
      - name: Test Hajj and Umrah group operations
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/pilgrim-groups.test.mjs
      - name: Test commission review register
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/commissions.test.mjs
      - name: Test independent Zarzour Soft delivery board
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/soft-projects.test.mjs
      - name: Test guarantee operations register
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/guarantees.test.mjs
      - name: Test verified organization directory
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/directory.test.mjs
      - name: Test unified Travel control center
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/dashboard.test.mjs
      - name: Test visa case operations
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/visas.test.mjs
      - name: Test booking operations
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/bookings.test.mjs
      - name: Test accounting journal
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/accounting.test.mjs
      - name: Guard deny-by-default Travel database access
        # Do not open browser-role policies or grants before an explicit security review.
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-travel-rls-boundary.mjs --self-test
          node scripts/check-travel-rls-boundary.mjs
      - name: Test secure operations schema
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node --test scripts/secure-schema.test.mjs
      - name: Test bilingual interactions
        # Run remaining checks after a test fails; retain the job's failure status.
        if: ${{ !cancelled() }}
        run: node scripts/test-interactions.mjs
