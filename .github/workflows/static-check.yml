name: Validate Zarzour static pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/static-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/static-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check static pages
        run: node scripts/check-static-site.mjs

      - name: Test trip request workflows
        run: node --test scripts/request.test.mjs


      - name: Test bilingual interactions
        run: node scripts/test-interactions.mjs
