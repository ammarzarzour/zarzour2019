name: Deploy Zarzour preview to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/zarzour-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: zarzour-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release before publishing
        run: node scripts/check-static-site.mjs
      - name: Test trip request workflows
        run: node --test scripts/request.test.mjs
      - name: Test operations dashboard model
        run: node --test scripts/operations.test.mjs
      - name: Test independent Zarzour Soft scope builder
        run: node --test scripts/soft-brief.test.mjs
      - name: Test partner verification register
        run: node --test scripts/partners.test.mjs
      - name: Test customer inquiry pipeline
        run: node --test scripts/customers.test.mjs
      - name: Test contracts and obligations register
        run: node --test scripts/contracts.test.mjs
      - name: Test campaign operations
        run: node --test scripts/campaigns.test.mjs
      - name: Test Hajj and Umrah group operations
        run: node --test scripts/pilgrim-groups.test.mjs
      - name: Test commission review register
        run: node --test scripts/commissions.test.mjs
      - name: Test independent Zarzour Soft delivery board
        run: node --test scripts/soft-projects.test.mjs
      - name: Test guarantee operations register
        run: node --test scripts/guarantees.test.mjs
      - name: Test bilingual interactions
        run: node scripts/test-interactions.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

