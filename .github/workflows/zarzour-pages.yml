name: Deploy Zarzour preview to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/zarzour-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: zarzour-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release before publishing
        run: node scripts/check-static-site.mjs
      - name: Test trip request workflows
        run: node --test scripts/request.test.mjs
      - name: Test bilingual interactions
        run: node scripts/test-interactions.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

